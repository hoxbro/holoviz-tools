[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "issuestore"
version = "0.1.0"
description = "Embed a GitHub repo's issues into a vector store for duplicate detection, classification, and clustering, exposed over MCP."
requires-python = ">=3.14"
dependencies = [
    "chromadb",
    "sentence-transformers",
    "mcp",
    "httpx2",
    "platformdirs",
    "numpy",
    "pandas",
    "scikit-learn",
    "holoviews",
    "panel",
    "panel-material-ui",
]

[project.scripts]
issuestore = "issuestore.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/issuestore"]
